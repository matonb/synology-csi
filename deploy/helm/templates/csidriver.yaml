{{- if $.Values.installCSIDriver }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: csi.san.synology.com
spec:
  attachRequired: true # Indicates the driver requires an attach operation (TODO: ControllerPublishVolume should be implemented)
  podInfoOnMount: true
  # File makes kubelet apply a pod's fsGroup to every volume that sets one,
  # including ReadWriteMany. The default (ReadWriteOnceWithFSType) skips RWX
  # volumes, which stay root-owned. Pods without an fsGroup are unaffected.
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
{{- end }}
